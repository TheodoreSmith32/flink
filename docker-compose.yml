# Kafka LOKAL buat demo/latihan yang butuh broker tapi TIDAK boleh numpang
# data dummy di broker dev Bank Sinarmas beneran (KAFKA_BOOTSTRAP_SERVERS/
# KAFKA_TOPIC di .env). Dipakai jobs/hello_flink_watermark.py +
# producer/watermark_demo_producer.py (KAFKA_LOCAL_BOOTSTRAP_SERVERS,
# default localhost:9094, cocok dengan listener EXTERNAL di bawah). KRaft
# mode (tanpa Zookeeper) -- single broker, cukup buat demo, bukan produksi.
#
# (Sempat juga dipakai use case fraud detection yang sudah dihapus dari
# repo ini -- kalau nemu sisa referensi "flink-fraud-*"/port 5433 di
# tempat lain, itu peninggalan yang boleh dibersihkan juga.)
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: flink-local-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      # Listener PLAINTEXT (9092) buat dipakai antar-container (Flink job
      # kalau nanti dijalankan di container juga); EXTERNAL (9094) buat
      # diakses dari host (script Python kamu di luar Docker).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: U1IGIskfQFyyd4dzXGWz6A
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - flink-local-kafka-data:/var/lib/kafka/data

volumes:
  flink-local-kafka-data:
