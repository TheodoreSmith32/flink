  #     - ./postgres-ddl:/docker-entrypoint-initdb.d:ro
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2g

  mysql:
    image: mysql:8.4
    container_name: mysql
    hostname: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: mysql
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-ddl:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 2g

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    depends_on:
      - mysql
      - postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  postgres-data:
  mysql-data:
  metabase-data: